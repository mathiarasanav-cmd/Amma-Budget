<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a5c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f4a3a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>அம்மா பட்ஜெட்</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f6f3; --card: #ffffff; --card2: #eef3ef; --line: #e1e7e2; --text: #16201b; --text2: #4d5a53; --muted: #7c8a82;
  --pri: #0b7a5c; --pri2: #0e9470; --pri-soft: #dff1ea; --on-pri: #fff;
  --bar: #2a78d6; --good: #0ca30c; --warn: #b57e00; --warn-bg: #fff4d6; --crit: #d03b3b; --crit-bg: #fde8e8;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.05);
  font-size: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #101412; --card: #1a201d; --card2: #232b27; --line: #2d3531; --text: #eef3f0; --text2: #b9c5bf; --muted: #8b9892;
    --pri: #3fcf9e; --pri2: #5ad8ab; --pri-soft: #183a2f; --on-pri: #06281d; --bar: #3987e5;
    --good: #5bd05b; --warn: #f0b93a; --warn-bg: #3a2f10; --crit: #ff8f8f; --crit-bg: #3b1818;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --hdr: #0f4a3a;
  }
}
:root.fs1 { font-size: 18px; } :root.fs2 { font-size: 20px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: "Noto Sans Tamil", "Latha", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45; padding-bottom: calc(88px + env(safe-area-inset-bottom)); overscroll-behavior-y: contain; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }

/* header */
header { position: sticky; top: 0; z-index: 20; background: var(--hdr, #0b7a5c); color: #fff; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; display: flex; align-items: center; gap: 8px; }
header h1 { font-size: 1.15rem; margin: 0; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .ib { background: rgba(255,255,255,.16); border: 0; color: inherit; height: 38px; min-width: 38px; border-radius: 19px; padding: 0 10px; font-size: .95rem; }
#sync { font-size: .75rem; background: rgba(0,0,0,.18); padding: 4px 8px; border-radius: 10px; display: none; }
#sync.on { display: inline-block; }
.mbar { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 12px 0; }
.mbar button { border: 1px solid var(--line); background: var(--card); width: 42px; height: 42px; border-radius: 21px; font-size: 1.2rem; }
.mbar b { min-width: 170px; text-align: center; font-size: 1.05rem; }

main { padding: 12px 12px 20px; max-width: 640px; margin: 0 auto; }
.card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card h2 { font-size: 1.02rem; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.card h2 .r { margin-left: auto; font-size: .85rem; font-weight: 500; color: var(--pri); background: none; border: 0; padding: 4px; }
.hero { background: linear-gradient(135deg, #0b7a5c, #12a07a); color: #fff; }
@media (prefers-color-scheme: dark) { .hero { background: linear-gradient(135deg, #0e5a45, #127a5e); } }
.hero .k { opacity: .9; font-size: .95rem; }
.hero .big { font-size: 2.3rem; font-weight: 800; letter-spacing: -.5px; }
.hero .s { opacity: .9; font-size: .88rem; }
.hero .row { display: flex; gap: 8px; margin-top: 12px; }
.hero .row button { flex: 1; border: 0; background: rgba(255,255,255,.2); color: #fff; border-radius: 12px; padding: 10px 6px; font-weight: 600; font-size: .9rem; }
.k2 { color: var(--text2); font-size: .9rem; }
.v2 { font-size: 1.6rem; font-weight: 800; }
.meter { height: 10px; background: var(--card2); border-radius: 5px; overflow: hidden; margin: 10px 0 6px; }
.meter i { display: block; height: 100%; background: var(--pri2); border-radius: 5px; transition: width .5s; }
.meter i.over { background: var(--crit); }
.note { color: var(--muted); font-size: .82rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini { background: var(--card2); border-radius: 14px; padding: 10px 12px; }
.mini .k2 { font-size: .8rem; }
.mini b { font-size: 1.15rem; display: block; margin-top: 2px; }

/* alerts */
.al { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; margin-top: 8px; background: var(--card2); border: 0; width: 100%; text-align: left; }
.al .ic { font-size: 1.6rem; width: 40px; text-align: center; }
.al .t { flex: 1; } .al .t b { display: block; font-size: 1rem; } .al .t span { font-size: .85rem; color: var(--text2); }
.al.crit { background: var(--crit-bg); } .al.crit .t span { color: var(--crit); font-weight: 600; }
.al.warn { background: var(--warn-bg); } .al.warn .t span { color: var(--warn); font-weight: 600; }

/* lists */
.li { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.li:last-child { border-bottom: 0; }
.li .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--card2); display: grid; place-items: center; font-size: 1.45rem; flex: none; }
.li .t { flex: 1; min-width: 0; } .li .t b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .t span { font-size: .82rem; color: var(--text2); }
.li .a { text-align: right; font-weight: 700; white-space: nowrap; } .li .a small { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; }
.day { font-size: .85rem; color: var(--text2); font-weight: 600; margin: 14px 4px 4px; display: flex; }
.day span { margin-left: auto; }
.tag { display: inline-block; font-size: .72rem; padding: 1px 7px; border-radius: 8px; background: var(--pri-soft); color: var(--pri); font-weight: 600; margin-left: 4px; vertical-align: 1px; }
.tag.son { background: var(--card2); color: var(--text2); }

/* stock */
.stk { padding: 12px 2px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.stk:last-child { border-bottom: 0; }
.stk .ic { font-size: 1.6rem; width: 44px; height: 44px; border-radius: 12px; background: var(--card2); display: grid; place-items: center; flex: none; }
.stk .t { flex: 1; min-width: 0; }
.stk .t b { font-weight: 600; }
.stk .lvl { height: 8px; background: var(--card2); border-radius: 4px; overflow: hidden; margin: 6px 0 3px; }
.stk .lvl i { display: block; height: 100%; background: var(--pri2); border-radius: 4px; }
.stk .lvl i.warn { background: #eda100; } .stk .lvl i.crit { background: var(--crit); }
.stk .s { font-size: .82rem; color: var(--text2); display: flex; gap: 6px; }
.stk .s .d { margin-left: auto; font-weight: 600; }
.stk .s .d.crit { color: var(--crit); } .stk .s .d.warn { color: var(--warn); }

/* chart */
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--text2); font-size: 11px; }
.cbar { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin-bottom: 10px; font-size: .92rem; }
.cbar .tr { grid-column: 1 / -1; height: 10px; background: var(--card2); border-radius: 5px; overflow: hidden; }
.cbar .tr i { display: block; height: 100%; background: var(--bar); border-radius: 0 5px 5px 0; }

/* nav + fab */
nav#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--card); border-top: 1px solid var(--line); display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
nav#tabs button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .75rem; color: var(--text2); padding: 4px 0; }
nav#tabs button .i { font-size: 1.35rem; width: 60px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition: background .2s; }
nav#tabs button.on { color: var(--text); font-weight: 700; }
nav#tabs button.on .i { background: var(--pri-soft); }
#fab { position: fixed; right: 16px; bottom: calc(82px + env(safe-area-inset-bottom)); z-index: 26; border: 0; background: var(--pri); color: var(--on-pri); height: 58px; padding: 0 22px 0 18px; border-radius: 18px; font-size: 1.05rem; font-weight: 700; box-shadow: 0 6px 16px rgba(11,122,92,.35); display: flex; align-items: center; gap: 8px; }
#fab span { font-size: 1.6rem; line-height: 1; }

/* sheets */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; animation: up .22s cubic-bezier(.2,.9,.3,1); padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet .sh { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 10px) 12px 10px; background: var(--card); border-bottom: 1px solid var(--line); }
.sheet .sh b { flex: 1; font-size: 1.1rem; }
.sheet .sh .x { border: 0; background: var(--card2); width: 42px; height: 42px; border-radius: 21px; font-size: 1.2rem; }
.sheet .body { padding: 14px; max-width: 640px; margin: 0 auto; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .85rem; text-align: center; line-height: 1.2; min-height: 92px; }
.tile .e { font-size: 1.9rem; }
.tile:active { transform: scale(.96); background: var(--pri-soft); }
.gh { font-size: .9rem; color: var(--text2); font-weight: 700; margin: 16px 2px 8px; }
label.f { display: block; font-size: .9rem; color: var(--text2); margin: 14px 2px 6px; font-weight: 600; }
.in { width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; font-size: 1.05rem; outline: none; }
.in:focus { border-color: var(--pri); }
.in.big { font-size: 1.8rem; font-weight: 800; padding: 10px 14px; }
.amt { display: flex; align-items: center; gap: 8px; }
.amt .rs { font-size: 1.8rem; font-weight: 800; color: var(--text2); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 20px; padding: 7px 14px; font-size: .92rem; position: relative; }
.chip.on { background: var(--pri); border-color: var(--pri); color: var(--on-pri); font-weight: 700; }
.seg { display: flex; background: var(--card2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: 0; background: none; padding: 10px 6px; border-radius: 11px; font-size: .92rem; }
.seg button.on { background: var(--card); font-weight: 700; box-shadow: var(--shadow); }
.hint { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--card2); font-size: .88rem; color: var(--text2); }
.hint.warn { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.hint.good { background: var(--pri-soft); color: var(--pri); font-weight: 600; }
.btn { border: 0; border-radius: 16px; padding: 15px 18px; font-size: 1.05rem; font-weight: 700; width: 100%; background: var(--card2); }
.btn.pri { background: var(--pri); color: var(--on-pri); }
.btn.del { background: none; color: var(--crit); margin-top: 6px; }
.btn:disabled { opacity: .45; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
.savebar .btn { max-width: 612px; margin: 0 auto; display: block; }
.selhead { display: flex; align-items: center; gap: 12px; background: var(--card); padding: 12px; border-radius: 16px; }
.selhead .e { font-size: 2.2rem; }
.selhead b { font-size: 1.15rem; display: block; }
.selhead button { margin-left: auto; border: 0; background: var(--card2); border-radius: 12px; padding: 8px 12px; font-size: .85rem; }
.qty { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }
table.ph { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.ph th, table.ph td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; }
table.ph th { color: var(--muted); font-weight: 600; font-size: .78rem; }
table.ph .r { text-align: right; }
table.ph tr.low td { color: var(--pri); font-weight: 700; }
.bigbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.bigbtns button { border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 6px; font-size: .92rem; }
.bigbtns button b { display: block; font-size: 1.1rem; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; font-size: .92rem; }
.toast { position: fixed; left: 50%; bottom: calc(160px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 14px; z-index: 90; font-size: .95rem; max-width: 90vw; text-align: center; animation: up .2s; }
.enter > * { animation: fade .25s ease both; } .enter > *:nth-child(2) { animation-delay: .03s; } .enter > *:nth-child(3) { animation-delay: .06s; } .enter > *:nth-child(n+4) { animation-delay: .09s; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .enter > *, .sheet, .toast { animation: none; } }

/* login */
#login { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 20px; }
#login.on { display: flex; }
#login .box { width: 100%; max-width: 380px; text-align: center; }
#login img { width: 88px; height: 88px; border-radius: 22px; }
#login h2 { margin: 12px 0 4px; }
#login .err { color: var(--crit); min-height: 22px; margin-top: 8px; font-weight: 600; }
#install { display: none; }

/* ===== v2: compact home, voice, ledger ===== */
.hero.v2 { padding: 14px 16px; }
.hero.v2 .big { font-size: 2.1rem; }
.hero .hmini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.hero .hmini div { background: rgba(255,255,255,.14); border-radius: 10px; padding: 6px 8px; }
.hero .hmini span { display: block; font-size: .72rem; opacity: .9; }
.hero .hmini b { font-size: 1rem; }
.meter.light { background: rgba(255,255,255,.25); margin: 10px 0 2px; height: 7px; }
.meter.light i { background: #fff; } .meter.light i.over { background: #ffb3b3; }
.qgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.qt { border: 1px solid var(--line); background: var(--card2); border-radius: 14px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 86px; }
.qt .e { font-size: 1.6rem; line-height: 1.2; } .qt .n { font-size: .72rem; line-height: 1.2; text-align: center; color: var(--text2); }
.qt .p { font-size: .8rem; font-weight: 700; color: var(--pri); }
#mic { position: fixed; left: 16px; bottom: calc(82px + env(safe-area-inset-bottom)); z-index: 26; width: 58px; height: 58px; border-radius: 29px; border: 0; background: #e8505b; color: #fff; font-size: 1.6rem; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.vlisten { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; }
.vlisten .vbox { background: var(--card); width: 100%; border-radius: 22px 22px 0 0; padding: 24px 18px calc(24px + env(safe-area-inset-bottom)); text-align: center; display: grid; gap: 10px; }
.vmic { font-size: 3rem; animation: vp 1.2s ease-in-out infinite; }
@keyframes vp { 50% { transform: scale(1.18); } }
.vlive { min-height: 1.4em; font-weight: 600; color: var(--pri); }
.vheard { background: var(--card2); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
.vrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.vrow .e { font-size: 1.5rem; } .vrow .vt { flex: 1; min-width: 0; } .vrow .vt b { display: block; }
.vrow .vq { font-size: .85rem; color: var(--text2); } .vrow .vq input { width: 70px; padding: 4px 8px; display: inline-block; }
.vrow .vamt { width: 96px; font-weight: 700; } .vrow .rs { color: var(--muted); }
.vx { border: 0; background: none; color: var(--muted); font-size: 1.1rem; padding: 6px; }
.chip.again { display: block; width: 100%; text-align: left; margin: 0 0 8px; background: var(--pri-soft); color: var(--pri); border-color: transparent; font-weight: 600; }
.btn.more { flex: 0 0 auto; margin-right: 8px; background: var(--card2); color: var(--pri); }
.ledsum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
.ledsum div { background: var(--card2); border-radius: 10px; padding: 6px 8px; } .ledsum span { display: block; font-size: .72rem; color: var(--muted); }
.ledsum b { font-size: .95rem; } .ledsum .plus b { color: var(--good); } .ledsum .minus b { color: var(--crit); } .ledsum .tot { background: var(--pri-soft); }
table.led { width: 100%; border-collapse: collapse; font-size: .85rem; } table.led th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px; }
table.led td { padding: 6px 4px; border-top: 1px solid var(--line); } table.led .r { text-align: right; }
table.led td.plus { color: var(--good); font-weight: 700; } table.led td.minus { color: var(--crit); }
</style>
</head>
<body>
<header>
  <h1 id="title">அம்மா பட்ஜெட்</h1>
  <span id="sync"></span>
  <button class="ib" id="gear" aria-label="அமைப்புகள்">⚙️</button>
</header>
<div id="mbar" class="mbar"></div>
<main id="main"><div class="empty">ஏற்றுகிறது…</div></main>
<button id="fab" aria-label="வாங்கியதை சேர்"><span>+</span>வாங்கியது</button>
<nav id="tabs">
  <button data-tab="home"><span class="i">🏠</span>முகப்பு</button>
  <button data-tab="buys"><span class="i">🧾</span>வாங்கியவை</button>
  <button data-tab="stock"><span class="i">📦</span>இருப்பு</button>
  <button data-tab="money"><span class="i">📊</span>கணக்கு</button>
</nav>

<div id="login"><div class="box">
  <img src="icon-192.png" alt="">
  <h2>அம்மா பட்ஜெட்</h2>
  <div class="note">முதல் முறை மட்டும் இணைக்கவும்</div>
  <div id="lgUrlW"><label class="f" for="lgUrl">ஆப் இணைப்பு (/exec)</label><input class="in" id="lgUrl" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" style="font-size:.9rem"></div>
  <label class="f" for="lgPin">PIN</label>
  <input class="in big" id="lgPin" type="password" autocomplete="current-password" style="text-align:center;letter-spacing:4px">
  <div class="err" id="lgErr"></div>
  <button class="btn pri" id="lgBtn">திற</button>
  <button class="btn" id="lgChg" style="background:none;color:var(--pri);font-size:.9rem;display:none">இணைப்பை மாற்று</button>
</div></div>

<script>
/* ================== basics ================== */
var D = null, TAB = 'home', M = ym(new Date());
function $(id) { return document.getElementById(id); }
function ls(k, v) { try { if (arguments.length === 1) return localStorage.getItem(k); v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { return null; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function num(v) { return v === '' || v == null ? 0 : Number(v) || 0; }
function sum(a, f) { return a.reduce(function (t, x) { return t + (f ? f(x) : x); }, 0); }
function ym(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
function iso(d) { return ym(d) + '-' + ('0' + d.getDate()).slice(-2); }
function today() { return iso(new Date()); }
function pd(s) { return new Date(s + 'T00:00:00'); }

// record "how much is left" and learn the monthly usage
function setLeft(it, left) {
  var t = today(), prev = D.Checks.filter(function (c) { return c.ItemID === it.ID; }).sort(function (a, b) { return a.Date < b.Date ? 1 : -1; })[0];
  var buys = D.Purchases.filter(function (p) { return p.ItemID === it.ID && num(p.Qty) > 0; }).sort(function (a, b) { return a.Date < b.Date ? -1 : 1; });
  var fromD, fromQ;
  if (prev) { fromD = prev.Date; fromQ = num(prev.Left); } else if (buys.length) { fromD = buys[0].Date; fromQ = 0; }
  var msg = 'சேமிக்கப்பட்டது ✓';
  if (fromD) {
    var added = sum(buys.filter(function (p) { return prev ? p.Date >= fromD && String(p.CreatedAt) > String(prev.CreatedAt) || p.Date > fromD : true; }), function (p) { return conv(num(p.Qty), p.Unit, it.Unit); });
    var used = fromQ + added - left, months = daysBetween(fromD, t) / 30.4375;
    if (months >= 0.4 && used > 0) {
      var learned = used / months, nv = num(it.PerMonth) > 0 ? r1((num(it.PerMonth) + learned) / 2 * 10) / 10 : r1(learned);
      nv = Math.round(nv * 100) / 100;
      if (Math.abs(nv - num(it.PerMonth)) >= 0.05) { save('Items', Object.assign({}, it, { PerMonth: nv })); msg = '✨ மாத பயன்பாடு ' + fq(nv) + ' ' + uL(it.Unit) + ' ஆக மாற்றப்பட்டது'; }
    }
  }
  save('Checks', { Date: t, ItemID: it.ID, Left: left });
  toast(msg);
}

    r.onresult = function (e) { said = ''; for (var i = 0; i < e.results.length; i++) said += e.results[i][0].transcript + ' '; ov.querySelector('.vlive').textContent = said; };
    r.onerror = function (e) { if (done) return; done = true; ov.remove(); if (e.error === 'not-allowed') toast('மைக் அனுமதி தேவை'); reviewSheet(said.trim(), parseSpeech(said)); };
    r.onend = finish;
    ov.querySelector('[data-vstop]').onclick = function () { try { r.stop(); } catch (x) { finish(); } };
    try { r.start(); } catch (x) { finish(); }
  }
  window.startVoice = listen;

  /* ---------- buy form: "same as last time" and "save + add another" ---------- */
  var _buyForm = window.buyForm, AGAIN = null;
  window.buyForm = function (itemId, edit) {
    _buyForm(itemId, edit);
    var s = SHEETS[SHEETS.length - 1]; if (!s || edit) return;
    var q = function (id) { return s.querySelector('#' + id); }, l = itemId && lastBuy(itemId);
    if (l && q('bAmt')) {
      var chip = document.createElement('button'); chip.className = 'chip again'; chip.type = 'button';
      chip.innerHTML = '↺ கடந்த முறை போல: ' + (num(l.Qty) ? fq(l.Qty) + ' ' + uL(l.Unit) + ' · ' : '') + inr(l.Amount) + (l.Shop ? ' · ' + esc(l.Shop) : '');
      var amtWrap = q('bAmt').closest('.amt') || q('bAmt'); amtWrap.parentNode.insertBefore(chip, amtWrap);
      chip.onclick = function () {
        if (q('bQty') && num(l.Qty)) { q('bQty').value = fq(l.Qty); if (q('bUnit') && l.Unit) { q('bUnit').value = l.Unit; q('bUnit').dispatchEvent(new Event('change', { bubbles: true })); } }
        q('bAmt').value = num(l.Amount); if (l.Shop && q('bShop')) q('bShop').value = l.Shop;
        q('bAmt').dispatchEvent(new Event('input', { bubbles: true })); q('bAmt').focus();
      };
    }
    if (AGAIN) { if (q('bShop') && AGAIN.shop) q('bShop').value = AGAIN.shop; if (AGAIN.date && AGAIN.date !== today() && q('bDate')) { q('bDate').value = AGAIN.date; q('bDate').dispatchEvent(new Event('change', { bubbles: true })); } AGAIN = null; }
    var save = q('bSave'); if (!save) return;
    var more = document.createElement('button'); more.className = 'btn more'; more.type = 'button'; more.textContent = '+ இன்னொன்று';
    save.parentNode.insertBefore(more, save);
    more.onclick = function () {
      if (!(evalAmt(q('bAmt').value) > 0)) { q('bAmt').focus(); return; }
      var dt = q('bDate') && q('bDate').value;
      AGAIN = { shop: q('bShop') ? q('bShop').value.trim() : '', date: dt || today() };
      save.click();
      setTimeout(function () { openBuy(); }, 380);
    };
  };

  /* ---------- wiring ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act="voice"],[data-act="morealerts"],#mic'); if (!t) return;
    e.stopPropagation();
    if (t.dataset.act === 'morealerts') { SHOW_ALL_ALERTS = !SHOW_ALL_ALERTS; render(); return; }
    listen();
  }, true);
  var mic = document.createElement('button'); mic.id = 'mic'; mic.setAttribute('aria-label', 'பேசி சேர்'); mic.textContent = '🎤';
  document.body.appendChild(mic);
  var _render = window.render;
  window.render = function () { _render(); var m = document.getElementById('mic'); if (m) m.style.display = TAB === 'money' ? 'none' : ''; };
})();

</script>
</body>
