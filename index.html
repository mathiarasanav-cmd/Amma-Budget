<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a5c">

<title>அம்மா கணக்கு</title>
<style>
:root { --g: #0b7a5c; --g2: #e3f4ee; --bg: #f4f6f3; --card: #fff; --t: #1b1f1d; --m: #5f6b66; --r: #c62828; --o: #e8833a; --y: #fff4d6; --line: #e3e7e4; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--t); font: 18px/1.45 "Noto Sans Tamil", system-ui, sans-serif; }
body { padding-bottom: env(safe-area-inset-bottom); }
.wrap { max-width: 560px; margin: 0 auto; padding: 14px 14px 40px; }
h1 { font-size: 22px; margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; }
h1 small { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--m); }
.card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.hero { background: linear-gradient(135deg, #0b7a5c, #12a07a); color: #fff; }
.hero .k { opacity: .9; font-size: 16px; }
.hero .big { font-size: 44px; font-weight: 800; letter-spacing: -.5px; margin: 2px 0 6px; }
.hero .row { display: flex; gap: 8px; font-size: 14px; }
.hero .row div { flex: 1; background: rgba(255,255,255,.16); border-radius: 12px; padding: 8px 10px; }
.hero .row b { display: block; font-size: 17px; }
.acts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.act { border: 0; border-radius: 18px; padding: 16px 6px; font: inherit; font-weight: 700; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.act .i { font-size: 34px; line-height: 1; }
.act.mic { background: #c62828; } .act.type { background: #1565c0; } .act.cam { background: #6a1b9a; }
.act span { font-size: 15px; }
.typebox { display: none; gap: 8px; margin-bottom: 12px; }
.typebox.on { display: flex; }
.typebox textarea { flex: 1; font: inherit; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; min-height: 52px; resize: none; }
.typebox button { border: 0; background: var(--g); color: #fff; font: inherit; font-weight: 700; border-radius: 14px; padding: 0 18px; }
.eg { font-size: 14px; color: var(--m); margin: -4px 4px 12px; }
.errand { background: var(--y); border: 2px solid #f1c75b; }
.errand .t { font-weight: 700; }
.errand .r { display: flex; gap: 8px; margin-top: 10px; }
.errand input { flex: 1; font: inherit; font-size: 20px; border: 2px solid #e8c56a; border-radius: 12px; padding: 8px 12px; width: 100%; }
.errand button { border: 0; background: var(--g); color: #fff; font: inherit; font-weight: 700; border-radius: 12px; padding: 0 16px; }
.sec { font-size: 15px; color: var(--m); margin: 16px 4px 8px; display: flex; }
.sec a { margin-left: auto; color: var(--g); text-decoration: none; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .ic { font-size: 26px; width: 40px; height: 40px; display: grid; place-items: center; background: var(--g2); border-radius: 12px; flex: none; }
.li .tx { flex: 1; min-width: 0; }
.li .tx b { display: block; font-size: 17px; font-weight: 600; }
.li .tx small { color: var(--m); font-size: 13px; }
.li .a { font-weight: 800; font-size: 18px; white-space: nowrap; }
.a.in { color: var(--g); } .a.out { color: var(--t); }
.empty { color: var(--m); text-align: center; padding: 14px; font-size: 15px; }
/* sheets */
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet .pane { background: #fff; width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; }
.pane h2 { margin: 0 0 6px; font-size: 21px; }
.said { background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 15px; color: var(--m); margin-bottom: 10px; }
.reply { font-weight: 600; margin: 6px 0 10px; }
.ent { display: flex; align-items: center; gap: 10px; padding: 10px; border: 2px solid var(--line); border-radius: 14px; margin-bottom: 8px; }
.ent.unsure { border-color: #f1c75b; background: #fffaf0; }
.ent .ic { font-size: 26px; }
.ent .tx { flex: 1; min-width: 0; }
.ent .tx b { display: block; }
.ent .tx small { color: var(--m); font-size: 13px; }
.ent input { width: 100px; font: inherit; font-weight: 800; font-size: 20px; text-align: right; border: 2px solid var(--line); border-radius: 10px; padding: 6px 8px; }
.ent .x { border: 0; background: none; font-size: 22px; color: var(--m); padding: 4px; }
.q { background: #fff4e5; border-radius: 12px; padding: 10px 12px; color: #8a4b00; margin: 8px 0; }
.btns { display: flex; gap: 10px; margin-top: 14px; }
.btns button { flex: 1; border: 0; border-radius: 16px; padding: 16px; font: inherit; font-weight: 800; font-size: 19px; }
.ok { background: var(--g); color: #fff; } .no { background: #e9ecea; color: var(--t); }
.listen .pulse { width: 120px; height: 120px; margin: 18px auto; border-radius: 50%; background: #c62828; display: grid; place-items: center; font-size: 54px; animation: p 1.2s infinite; }
@keyframes p { 0% { box-shadow: 0 0 0 0 rgba(198,40,40,.5); } 70% { box-shadow: 0 0 0 26px rgba(198,40,40,0); } 100% { box-shadow: 0 0 0 0 rgba(198,40,40,0); } }
.live { text-align: center; min-height: 54px; font-size: 19px; }
.toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: #1b1f1d; color: #fff; padding: 12px 18px; border-radius: 14px; z-index: 40; font-size: 16px; max-width: 90%; text-align: center; }
.busy { text-align: center; padding: 26px; font-size: 18px; }
.spin { width: 38px; height: 38px; border: 4px solid var(--g2); border-top-color: var(--g); border-radius: 50%; margin: 0 auto 10px; animation: s 0.9s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
.login { text-align: center; padding-top: 12vh; }
.login input { font: inherit; font-size: 26px; text-align: center; border: 2px solid var(--line); border-radius: 14px; padding: 12px; width: 220px; margin: 14px 0; letter-spacing: 6px; }
.login button { border: 0; background: var(--g); color: #fff; font: inherit; font-weight: 800; border-radius: 14px; padding: 14px 40px; font-size: 20px; }
.err { color: var(--r); min-height: 24px; }
.photo { width: 100%; max-height: 180px; object-fit: contain; border-radius: 12px; background: var(--bg); margin-bottom: 8px; }
.tot { display: flex; justify-content: space-between; font-weight: 800; padding: 8px 4px 0; }
.book-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.book-top button, .chipb { border: 2px solid var(--line); background: #fff; border-radius: 12px; font: inherit; font-size: 17px; padding: 8px 12px; }
.chipb.on { background: #0d7a5f; color: #fff; border-color: #0d7a5f; }
.chips2 { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
.dayh { display: flex; justify-content: space-between; font-weight: 800; margin: 14px 4px 4px; color: #444; }
.fld { display: block; margin: 8px 0; font-size: 15px; color: #555; }
.fld input, .fld select { display: block; width: 100%; box-sizing: border-box; font: inherit; font-size: 20px; color: #111; border: 2px solid var(--line); border-radius: 12px; padding: 10px; margin-top: 3px; background: #fff; }
.bookbtn { width: 100%; border: 2px solid #0d7a5f; color: #0d7a5f; background: #fff; border-radius: 16px; font: inherit; font-weight: 800; font-size: 19px; padding: 12px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<script>
var API = '', TOKEN = '', D = null;
var MN = ['ஜனவரி', 'பிப்ரவரி', 'மார்ச்', 'ஏப்ரல்', 'மே', 'ஜூன்', 'ஜூலை', 'ஆகஸ்ட்', 'செப்டம்பர்', 'அக்டோபர்', 'நவம்பர்', 'டிசம்பர்'];
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function n(v) { return Number(v) || 0; }
function inr(v) { var x = Math.round(Math.abs(n(v))); return (n(v) < 0 ? '−' : '') + '₹' + x.toLocaleString('en-IN'); }
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3200); }
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function dayLabel(s) { var t = today(), y = new Date(); y.setDate(y.getDate() - 1); var ys = y.getFullYear() + '-' + ('0' + (y.getMonth() + 1)).slice(-2) + '-' + ('0' + y.getDate()).slice(-2); if (s === t) return 'இன்று'; if (s === ys) return 'நேற்று'; var p = String(s).split('-'); return +p[2] + ' ' + (MN[+p[1] - 1] || ''); }

/* ---------- server ---------- */
function post(body) {
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); });
}
function call(fn) {
  var args = [].slice.call(arguments, 1);
  return post({ action: 'call', token: TOKEN, fn: fn, args: args }).then(function (r) {
    if (!r.ok && r.error === 'AUTH') { ls('amma_token', null); TOKEN = ''; showLogin('மீண்டும் PIN போடுங்கள்'); throw new Error('AUTH'); }
    if (!r.ok) throw new Error(r.error || 'error');
    return r.result;
  });
}
function load() {
  return call('getAll').then(function (d) { D = d; ls('amma_cache', JSON.stringify(d)); render(); })
    .catch(function (e) { if (e.message !== 'AUTH') { if (!D) { try { D = JSON.parse(ls('amma_cache') || 'null'); } catch (x) {} } if (D) render(); toast('இணையம் இல்லை – பழைய தகவல் காட்டப்படுகிறது'); } });
}

/* ---------- numbers ---------- */
function calc() {
  var m = today().slice(0, 7);
  var received = D.Cash.reduce(function (t, c) { return t + n(c.Amount); }, 0);
  var spentMine = D.Purchases.filter(function (p) { return !p.PaidBy || p.PaidBy === 'amma'; }).reduce(function (t, p) { return t + n(p.Amount); }, 0);
  var given = (D.Errands || []).reduce(function (t, e) { return t + n(e.Given); }, 0);
  var back = (D.Errands || []).reduce(function (t, e) { return t + n(e.Returned); }, 0);
  var monthIn = D.Cash.filter(function (c) { return c.Month === m && n(c.Amount) > 0 && c.Kind !== 'count'; }).reduce(function (t, c) { return t + n(c.Amount); }, 0);
  var monthOut = D.Purchases.filter(function (p) { return p.Month === m; }).reduce(function (t, p) { return t + n(p.Amount); }, 0);
  var outAppa = (D.Errands || []).filter(function (e) { return e.Status !== 'closed'; }).reduce(function (t, e) { return t + n(e.Given); }, 0);
  return { cash: received - spentMine - given + back, monthIn: monthIn, monthOut: monthOut, outAppa: outAppa, m: m };
}
function entries(limitDays) {
  var out = [], from = new Date(); from.setDate(from.getDate() - (limitDays || 2));
  var fs = from.toISOString().slice(0, 10);
  D.Cash.forEach(function (c) { if (c.Date >= fs && c.Kind === 'count') { out.push({ t: 'Cash', id: c.ID, date: c.Date, at: c.CreatedAt, ic: '💰', title: (String(c.Note || '').match(/கையில் எண்ணியது ₹[\d.]+/) || ['கையில் எண்ணியது'])[0], sub: n(c.Amount) < 0 ? 'பதிவு செய்யாத செலவு ' + inr(-n(c.Amount)) : 'கூடுதல் ' + inr(c.Amount), amt: Math.abs(n(c.Amount)), cls: n(c.Amount) < 0 ? 'out' : 'in', sign: n(c.Amount) < 0 ? '' : '+' }); return; }
    if (c.Date >= fs) out.push({ t: 'Cash', id: c.ID, date: c.Date, at: c.CreatedAt, ic: '💵', title: (/^mathi$/i.test(c.From || '') ? 'மதி' : (c.From || 'பணம்')) + ' கொடுத்தது', sub: c.Note && c.Note.indexOf('கொடுத்தது') < 0 ? c.Note : '', amt: n(c.Amount), cls: 'in', sign: '+' }); });
  D.Purchases.forEach(function (p) { if (p.Date >= fs && p.ItemID !== 'errand') out.push({ t: 'Purchases', id: p.ID, date: p.Date, at: p.CreatedAt, ic: icon(p.ItemID), title: (p.Detail === 'pending' ? '📝 ' : '') + p.Name + (p.Qty ? ' ' + p.Qty + ' ' + (p.Unit || '') : ''), sub: [byText(p), p.ParentID ? p.Note + ' விவரம்' : '', p.Detail === 'pending' ? 'விவரம் சேர்க்கலாம்' : ''].filter(Boolean).join(' · '), amt: n(p.Amount), cls: 'out', sign: '', pending: p.Detail === 'pending' }); });
  (D.Errands || []).forEach(function (e) { if (e.Date >= fs || (e.ReturnedOn || '') >= fs) out.push({ t: 'Errands', id: e.ID, date: e.ReturnedOn || e.Date, at: e.CreatedAt, ic: '🧾', title: idam(e.Person) + ' கொடுத்தது' + (e.List ? ' – ' + e.List : ''), sub: e.Status === 'closed' ? 'திரும்ப ' + inr(e.Returned) + ' · செலவு ' + inr(e.Spent) : 'இன்னும் மீதி வரவில்லை', amt: n(e.Given), cls: 'out', sign: '' }); });
  return out.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)) || String(b.at).localeCompare(String(a.at)); });
}
/* ---------- 🔊 morning summary: what was spent yesterday, spoken in Tamil ---------- */
var MORNING_TRIED = false;
function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function rs(v) { return Math.round(n(v)) + ' ரூபாய்'; }
function morning() {
  var now = new Date(); if (now.getHours() < 5 || (now.getHours() >= 12 && ls('amma_spoken') === today())) return '';
  var y = new Date(now); y.setDate(y.getDate() - 1); var yd = ymd(y), c = calc();
  var pur = D.Purchases.filter(function (p) { return p.Date === yd; }), spent = pur.reduce(function (t, p) { return t + n(p.Amount); }, 0);
  var via = {}; pur.filter(function (p) { return p.PaidBy === 'errand'; }).forEach(function (p) { var k = errPerson(p.ErrandID); via[k] = (via[k] || 0) + n(p.Amount); });
  var viaT = Object.keys(via).map(function (k) { return k + ' மூலம் ' + rs(via[k]); }).join(', ');
  var got = D.Cash.filter(function (x) { return x.Date === yd && x.Kind !== 'count' && n(x.Amount) > 0; }).reduce(function (t, x) { return t + n(x.Amount); }, 0);
  var cats = {}; pur.forEach(function (p) { var k = p.Cat || 'மற்றவை'; cats[k] = (cats[k] || 0) + n(p.Amount); });
  var top = Object.keys(cats).sort(function (a, b) { return cats[b] - cats[a]; }).slice(0, 3).map(function (k) { return k + ' ' + rs(cats[k]); }).join(', ');
  var pend = pendingList().length;
  return 'வணக்கம் அம்மா. ' + (spent ? 'நேற்று ' + rs(spent) + ' செலவு ஆனது' + (top ? ' – ' + top : '') + '.' + (viaT ? ' அதில் ' + viaT + '.' : '') : 'நேற்று எந்த செலவும் பதிவு ஆகவில்லை. மறந்திருந்தால் "நேத்து 200 காய்கறி" என்று சொல்லுங்கள்.') +
    (got ? ' மதி ' + rs(got) + ' கொடுத்தார்.' : '') + ' இப்போது கையில் ' + rs(c.cash) + ' இருக்கு. இந்த மாதம் இதுவரை ' + rs(c.monthOut) + ' செலவு.' +
    withPeople().map(function (x) { return ' ' + idam(x.p) + ' ' + rs(x.a) + ' இருக்கு.'; }).join('') + (pend ? ' ' + pend + ' பதிவுகளுக்கு விவரம் சேர்க்க வேண்டும்.' : '');
}
function speak(text, onStart) {
  try {
    if (!window.speechSynthesis || !text) return false;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text); u.lang = 'ta-IN'; u.rate = 0.9; if (onStart) u.onstart = onStart;
    var v = speechSynthesis.getVoices().find(function (x) { return /^ta/i.test(x.lang); }); if (v) u.voice = v;
    speechSynthesis.speak(u); return true;
  } catch (e) { return false; }
}
function idam(p) { p = String(p || ''); return /[ிீை]$/.test(p) ? p + 'யிடம்' : p + 'விடம்'; }
function errPerson(id) { var e = (D.Errands || []).find(function (x) { return x.ID === id; }); return e ? e.Person : 'தாத்தா'; }
function byText(p) { return p.PaidBy === 'son' ? 'மதி கட்டினார்' : p.PaidBy === 'errand' ? errPerson(p.ErrandID) + ' வாங்கியது' : ''; }
function withPeople() {   // money still with Thatha / Mathi / Bakkiya, per person
  var m = {}; (D.Errands || []).filter(function (e) { return e.Status !== 'closed'; }).forEach(function (e) { m[e.Person] = (m[e.Person] || 0) + n(e.Given); });
  return Object.keys(m).map(function (k) { return { p: k, a: m[k] }; });
}
function pendingList() { return (D.Purchases || []).filter(function (p) { return p.Detail === 'pending'; }).sort(function (a, b) { return String(b.Date).localeCompare(String(a.Date)); }); }
function icon(id) { var it = (D.Items || []).find(function (i) { return i.ID === id; }); return it && it.Icon ? it.Icon : '🛍️'; }

/* ---------- home ---------- */
var VIEW = 'home';
function render() {
  if (!D) return;
  if (VIEW === 'book') return renderBook();
  var c = calc(), open = (D.Errands || []).filter(function (e) { return e.Status !== 'closed'; });
  var mb = morning();
  var h = '<h1>அம்மா கணக்கு <small>' + dayLabel(today()) + '</small></h1>' +
    (mb ? '<div class="card" id="mcard" style="background:#fff7e0;border:2px solid #f0c040"><div class="t" style="font-size:19px;font-weight:800">🔊 நேற்றைய கணக்கு <span style="font-size:14px;font-weight:600;opacity:.7">(தொட்டால் சொல்லும்)</span></div><div style="font-size:17px;margin-top:6px;line-height:1.5">' + esc(mb) + '</div></div>' : '') +
    (D.Cash.some(function (x) { return x.Kind === 'count'; }) ? '' : '<div class="card errand"><div class="t">💰 முதலில்: இப்போது கையில் எவ்வளவு பணம் இருக்கு?</div><div style="font-size:15px;margin-top:4px">எண்ணி போடுங்கள் – இன்று முதல் கணக்கு சரியாக இருக்கும்.</div><div class="r"><input inputmode="numeric" placeholder="₹ கையில் உள்ளது" id="cnt0"><button id="cntgo">சரி</button></div></div>') +
    '<div class="card hero" id="hero"><div class="k">கையில் உள்ள பணம் <span style="font-size:13px;opacity:.8">(தொட்டு சரிசெய்யலாம்)</span></div><div class="big">' + inr(c.cash) + '</div>' +
    '<div class="row"><div>' + (MN[+c.m.slice(5) - 1] || '') + ' வந்தது<b>' + inr(c.monthIn) + '</b></div><div>இந்த மாத செலவு<b>' + inr(c.monthOut) + '</b></div>' +
    withPeople().map(function (x) { return '<div>' + esc(idam(x.p)) + '<b>' + inr(x.a) + '</b></div>'; }).join('') + '</div></div>' +
    '<div class="acts"><button class="act mic" id="bMic"><span class="i">🎤</span><span>பேசுங்கள்</span></button>' +

/* ---------- voice ---------- */
var REC = null;
function dedupe(text) {   // same as the server: "meena meena meena 550" → "meena 550"
  var w = String(text || '').replace(/\s+/g, ' ').trim().split(' '), ch = true;
  while (ch) { ch = false; for (var n = Math.min(6, Math.floor(w.length / 2)); n >= 1 && !ch; n--) for (var i = 0; i + 2 * n <= w.length; i++) { if (w.slice(i, i + n).join(' ').toLowerCase() === w.slice(i + n, i + 2 * n).join(' ').toLowerCase()) { w.splice(i + n, n); ch = true; break; } } }
  return w.join(' ');
}
function listen() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { $('tbox').classList.add('on'); $('tin').focus(); toast('இந்த போனில் பேச்சு வசதி இல்லை – எழுதுங்கள்'); return; }
  sheet('<div class="listen"><h2 style="text-align:center">சொல்லுங்கள்…</h2><div class="pulse">🎤</div><div class="live" id="live">கேட்கிறேன்</div>' +
    '<div class="btns"><button class="no" data-x>நிறுத்து</button><button class="ok" id="ldone">முடிந்தது</button></div></div>');
  var said = '', rec = new SR(); REC = rec;
  rec.lang = 'ta-IN'; rec.interimResults = true; rec.continuous = true;
  // Android Chrome repeats earlier words in each new result ("meena", "meena meena 550"…): keep only the newest version of each phrase
  var finals = [];
  rec.onresult = function (e) {
    var interim = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      var t = e.results[i][0].transcript.trim(); if (!t) continue;
      if (!e.results[i].isFinal) { interim = t; continue; }
      var last = finals.length ? finals[finals.length - 1].toLowerCase() : '', tl = t.toLowerCase();
      if (last && tl.indexOf(last) === 0) finals[finals.length - 1] = t;        // grew from the last phrase
      else if (last && last.indexOf(tl) >= 0) { }                                // already have it
      else finals.push(t);
    }
    var lastF = finals.length ? finals[finals.length - 1].toLowerCase() : '';
    if (interim && lastF && interim.toLowerCase().indexOf(lastF) === 0) interim = interim.slice(lastF.length);
    said = dedupe((finals.join(' ') + ' ' + interim).trim()); var l = $('live'); if (l) l.textContent = said;
  };
  rec.onerror = function (e) { if (e.error === 'not-allowed') { close(); toast('மைக் அனுமதி தேவை (Chrome-ல் Allow அழுத்துங்கள்)'); } };
  rec.onend = function () { if (REC === rec) { REC = null; if (said) understand(said); else { close(); toast('எதுவும் கேட்கவில்லை. மீண்டும் முயற்சி செய்யுங்கள்.'); } } };
  $('ldone').onclick = function () { try { rec.stop(); } catch (e) {} };
  try { rec.start(); } catch (e) { close(); toast('மைக் தொடங்க முடியவில்லை'); }
}
